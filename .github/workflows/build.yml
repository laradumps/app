name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release (e.g. 4.14.5)'
                required: true

permissions:
    contents: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.set-version.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v7

            - name: Install Node.js and npm
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'

            - name: Bump version, commit and tag
              id: set-version
              env:
                  VERSION: ${{ github.event.inputs.version }}
                  # Commits made through the API as github-actions[bot] are signed by GitHub, so they pass the signed-commit rule.
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must be X.Y.Z, got $VERSION"; exit 1; fi
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT

                  # Running a release again for an existing tag rebuilds that tag instead of failing on the push.
                  if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
                      echo "Tag v${VERSION} already exists; building it again."
                      exit 0
                  fi

                  SHA=$(git rev-parse HEAD)
                  jq --indent 4 --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
                  if ! git diff --quiet package.json; then
                      SHA=$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/package.json" \
                          -f message="v${VERSION}" \
                          -f content="$(base64 -w0 package.json)" \
                          -f sha="$(git rev-parse HEAD:package.json)" \
                          -f branch="${GITHUB_REF_NAME}" \
                          --jq .commit.sha)
                  fi
                  gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="$SHA" --silent

    windows:
        needs: prepare
        runs-on: windows-latest
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v7
              with:
                  ref: v${{ needs.prepare.outputs.version }}

            - name: Install Node.js and npm
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: npm install --force

            - name: Updater
              run: git update-index --chmod=+x ./gen-update-xml.sh && sh ./gen-update-xml.sh
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: 💻 Release Windows
              run: npm run publish-win
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

    store:
        needs: prepare
        runs-on: windows-latest
        continue-on-error: true
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v7
              with:
                  ref: v${{ needs.prepare.outputs.version }}

            - name: Install Node.js and npm
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: npm install --force

            - name: 🏪 Build MSIX
              run: npm run build-appx

            - name: Upload MSIX
              uses: actions/upload-artifact@v4
              with:
                  name: LaraDumps-${{ needs.prepare.outputs.version }}-store
                  path: release/*.appx
                  if-no-files-found: error

    mac:
        needs: prepare
        runs-on: macos-latest
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v7
              with:
                  ref: v${{ needs.prepare.outputs.version }}

            - name: Install Node.js and npm
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: npm install --force

            - name: Updater
              run: git update-index --chmod=+x ./gen-update-xml.sh && sh ./gen-update-xml.sh
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: Release Mac
              run: npm run publish-mac
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

    linux:
        needs: prepare
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v7
              with:
                  ref: v${{ needs.prepare.outputs.version }}

            - name: Install Node.js and npm
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: npm install --force

            - name: 🐧 Release Linux (GitHub AppImage)
              run: npm run publish-linux
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

    # Own job so a Snap Store outage never blocks the other platforms; a failure here does not fail the run.
    snap:
        needs: prepare
        runs-on: ubuntu-latest
        continue-on-error: true
        timeout-minutes: 30
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v7
              with:
                  ref: v${{ needs.prepare.outputs.version }}

            - name: Install Node.js and npm
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: npm install --force

            - name: Install Snapcraft
              run: |
                  for i in 1 2 3; do sudo snap install snapcraft --classic && exit 0; sleep 30; done
                  exit 1

            - name: 📦 Publish Snap
              run: npm run publish-snap
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
                  SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
